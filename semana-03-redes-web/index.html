<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG - Galeria de Heróis</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>⚔️ Hall dos Heróis</h1>
        <p>Aventureiros cadastrados no reino</p>
    </header>

    <main>
        <section class="cards-container">
            <article class="hero-card">
                <h2>Arthur</h2>
                <span class="badge guerreiro">Guerreiro</span>
                <p>Vida: 100 | Ataque: 15</p>
                <p class="guilda">Guilda: Cavaleiros da Távola</p>
            </article>

            <article class="hero-card">
                <h2>Merlin</h2>
                <span class="badge mago">Mago</span>
                <p>Vida: 80 | Ataque: 12</p>
                <p class="guilda">Guilda: Círculo de Avalon</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Desenvolvido na Semana 03 - Back to Peak</p>
    </footer>

</body>

</html>
