spring.application.name=gamecore-api
server.port=8080

# Configuracao do Banco de Dados MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/gamecore_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Documentacao Swagger / OpenAPI UI
springdoc.swagger-ui.path=/swagger-ui.html
